[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "openpi-control"
version = "0.1.4"
description = "OpenPI native control runtime for supported robot arms, including YAM, ARX, and DROID"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenPI Control maintainers" }]
dependencies = [
  "numpy>=1.26",
  # Direct CAN access for the servo zeroing registry (openpi_control.servos).
  "python-can>=4.3",
  "pyzmq>=25",
  # Trossen iNerve Ethernet controllers: discovery, EEPROM zeroing, and IP
  # provisioning (openpi_control.servos.trossen_eth). Pinned to the same
  # release as the C++ libtrossen_arm in scripts/build_deps.sh so the driver
  # <-> controller firmware compatibility stays aligned.
  "trossen-arm==1.10.0",
  # USB-serial bus-servo maintenance sessions (openpi_control.servos.buses)
  # for the FeeTech/Dynamixel serial families (e.g. SO-ARM101).
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.py-api = "py3"
wheel.packages = ["src/openpi_control"]
wheel.install-dir = ""
sdist.include = [
  "native/**",
  "src/openpi_control/models/**",
  "src/openpi_control/arm_commands/**",
  "tests/**",
  "scripts/**",
]

[tool.scikit-build.cmake.define]
OPENPI_CONTROL_BUILD_NATIVE = "ON"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
